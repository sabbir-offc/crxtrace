name: Release

# Publishes to npm when a v* tag is pushed:
#
#   npm version minor        # bumps package.json, also bump SDK_VERSION in
#                            # src/types.ts — test/version.test.ts enforces it
#   git push --follow-tags
#
# Requires an NPM_TOKEN secret (an npm automation token) on the repository.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  # Required for npm provenance — publishes a signed attestation linking the
  # tarball to this workflow run and commit.
  id-token: write

jobs:
  publish:
    name: publish to npm
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org
          cache: npm

      - run: npm ci

      # Refuse to publish a tag that disagrees with package.json, rather than
      # shipping a version nobody can correlate with the repo.
      - name: Verify tag matches package version
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "tag v$tag does not match package.json version $pkg"
            exit 1
          fi

      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      - name: Publish
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes "See [CHANGELOG.md](https://github.com/${GITHUB_REPOSITORY}/blob/main/CHANGELOG.md)." \
            --verify-tag
