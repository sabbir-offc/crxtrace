name: Release

# Publishes to npm when a v* tag is pushed:
#
#   npm version minor        # bumps package.json, also bump SDK_VERSION in
#                            # src/types.ts — test/version.test.ts enforces it
#   git push --follow-tags
#
# Authenticates with npm via trusted publishing (OIDC) — there is no NPM_TOKEN
# and no stored credential of any kind. npm verifies the short-lived OIDC token
# against the trusted publisher configured on the package:
#
#   npmjs.com → crxtrace → Settings → Trusted Publisher → GitHub Actions
#     organization or user: sabbir-offc
#     repository:           crxtrace
#     workflow filename:    release.yml
#
# Renaming this file, or moving the publish to a different workflow, breaks
# authentication until the trusted publisher is updated to match.
#
# Running this manually (workflow_dispatch) on an already-published version is
# a safe way to smoke-test OIDC without releasing anything: the registry checks
# authentication before it checks the version, so
#
#   EPUBLISHCONFLICT / "cannot publish over previously published version"
#     -> authentication worked; trusted publishing is configured correctly
#   401 / 404 / "need auth"
#     -> the trusted publisher does not match this repo and workflow filename
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  # Required for trusted publishing: lets this run mint the OIDC token npm
  # exchanges for publish rights, and sign the provenance attestation.
  id-token: write

jobs:
  publish:
    name: publish to npm
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org
          cache: npm

      # Trusted publishing needs npm >= 11.5.1. Node 22 ships npm 10.x, so the
      # bundled version cannot authenticate and the publish fails with a
      # confusing 404/401 rather than anything mentioning OIDC.
      - name: Use an npm that supports trusted publishing
        run: |
          set -euo pipefail
          npm install -g npm@latest
          npm --version

      - run: npm ci

      # Refuse to publish a tag that disagrees with package.json, rather than
      # shipping a version nobody can correlate with the repo.
      #
      # Only meaningful for a tag push. On workflow_dispatch GITHUB_REF_NAME is
      # the branch name, so this would compare "main" against the version and
      # fail every manual run before it reached the publish step.
      - name: Verify tag matches package version
        if: github.ref_type == 'tag'
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "tag v$tag does not match package.json version $pkg"
            exit 1
          fi

      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      # No NODE_AUTH_TOKEN. Provenance is generated automatically for a public
      # package published this way, and publishConfig.provenance keeps it
      # explicit in package.json.
      - name: Publish
        run: npm publish

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes "See [CHANGELOG.md](https://github.com/${GITHUB_REPOSITORY}/blob/main/CHANGELOG.md)." \
            --verify-tag
